<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel | Amoremio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body><div class="admin-shell"><aside class="admin-sidebar"><h1>Amoremio</h1><small>Painel administrativo</small><nav><button class="is-active" data-tab="products">Produtos</button><button data-tab="categories">Categorias</button><button data-tab="orders">Pedidos</button><button data-tab="customers">Clientes</button><button data-tab="settings">Loja</button></nav><button class="logout" data-logout>Sair</button></aside><main class="admin-main"><p class="admin-message" data-global-message aria-live="polite"></p>
<section class="admin-panel is-active" data-panel="products"><div class="admin-heading"><h2>Produtos</h2><button class="admin-button" data-new-product>Novo produto</button></div><form class="admin-card hidden" data-product-form><input type="hidden" name="id"><div class="admin-grid"><div class="field"><label>Nome</label><input name="name" required minlength="2"></div><div class="field"><label>Slug (endereço)</label><input name="slug" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" required></div><div class="field"><label>Categoria</label><select name="category_id"><option value="">Sem categoria</option></select></div><div class="field"><label>Preço</label><input name="price" type="number" min="0" step="0.01" required></div><div class="field"><label>Preço promocional</label><input name="promotional_price" type="number" min="0" step="0.01"></div><div class="field"><label>Estoque total</label><input name="stock" type="number" min="0" step="1" value="0" required></div><div class="field wide"><label>Descrição</label><textarea name="description"></textarea></div><div class="field"><label>Material</label><input name="material"></div><div class="field"><label>Medidas</label><input name="dimensions"></div><label><input name="active" type="checkbox" checked> Produto ativo</label><label><input name="featured" type="checkbox"> Mostrar em destaque</label><div class="wide"><h3>Variações</h3><div data-variants></div><button type="button" class="admin-button" data-add-variant>Adicionar variação</button></div><section class="gallery-editor wide" aria-labelledby="gallery-title"><div class="gallery-editor__heading"><div><h3 id="gallery-title">Galeria de imagens</h3><p>Selecione várias fotos de uma vez. A quantidade é flexível e imagens grandes são otimizadas antes do envio.</p></div><label class="admin-button gallery-picker">Adicionar imagens<input name="images" type="file" accept="image/jpeg,image/png,image/webp" multiple></label></div><p class="gallery-message" data-gallery-message aria-live="polite"></p><progress class="gallery-progress" data-gallery-progress value="0" max="1" hidden>0%</progress><div class="image-preview" data-image-preview></div></section></div><div class="admin-actions"><button type="submit">Salvar produto</button><button class="secondary" type="button" data-cancel-product>Cancelar</button></div></form><div class="admin-list" data-products-list></div></section>
<section class="admin-panel" data-panel="categories"><div class="admin-heading"><h2>Categorias</h2></div><form class="admin-card" data-category-form><input type="hidden" name="id"><div class="admin-grid"><div class="field"><label>Nome</label><input name="name" required></div><div class="field"><label>Slug</label><input name="slug" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" required></div><div class="field wide"><label>URL da imagem (opcional)</label><input name="image_url" type="url"></div><label><input name="active" type="checkbox" checked> Categoria ativa</label></div><div class="admin-actions"><button type="submit">Salvar categoria</button><button class="secondary" type="reset">Limpar</button></div></form><div class="admin-list" data-categories-list></div></section>
<section class="admin-panel" data-panel="orders"><div class="admin-heading"><h2>Pedidos</h2><button class="admin-button" data-refresh-orders>Atualizar</button></div><div class="admin-list" data-orders-list></div></section>
<section class="admin-panel" data-panel="customers"><div class="admin-heading"><h2>Clientes</h2></div><div class="admin-list" data-customers-list></div></section>
<section class="admin-panel" data-panel="settings"><div class="admin-heading"><h2>Informações da loja</h2></div><form class="admin-card admin-grid" data-settings-form><div class="field"><label>Nome da loja</label><input name="store_name" required></div><div class="field"><label>WhatsApp</label><input name="whatsapp_number" required></div><div class="field"><label>Instagram</label><input name="instagram_url" type="url"></div><div class="field"><label>E-mail</label><input name="contact_email" type="email"></div><div class="field wide"><label>Endereço</label><input name="address"></div><div class="field"><label>Frete padrão</label><input name="default_shipping" type="number" min="0" step=".01"></div><div class="admin-actions wide"><button type="submit">Salvar informações</button></div></form></section></main></div><template id="variant-template"><div class="variant-row"><input name="variant_name" placeholder="Ex.: Cor" required><input name="variant_value" placeholder="Ex.: Dourado" required><input name="variant_adjustment" type="number" step=".01" value="0" aria-label="Ajuste de preço"><input name="variant_stock" type="number" min="0" value="0" aria-label="Estoque"><button type="button" data-remove-variant aria-label="Remover variação">×</button></div></template><script type="module" src="painel.js?v=20260730-2"></script></body></html>
