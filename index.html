<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4efe7" />
    <meta
      name="description"
      content="Amoremio — pequenos objetos, grandes afetos."
    />
    <title>Amoremio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="silk-filters" aria-hidden="true">
      <filter id="silk-wave-left" x="-8%" y="-5%" width="116%" height="110%">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.006 0.018"
          numOctaves="2"
          seed="7"
          result="noise"
        >
          <animate
            attributeName="baseFrequency"
            dur="11s"
            values="0.006 0.018;0.009 0.024;0.006 0.018"
            repeatCount="indefinite"
          />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="B">
          <animate attributeName="scale" dur="8s" values="9;15;10;13;9" repeatCount="indefinite" />
        </feDisplacementMap>
      </filter>
      <filter id="silk-wave-right" x="-8%" y="-5%" width="116%" height="110%">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.007 0.02"
          numOctaves="2"
          seed="13"
          result="noise"
        >
          <animate
            attributeName="baseFrequency"
            dur="13s"
            values="0.007 0.02;0.005 0.026;0.007 0.02"
            repeatCount="indefinite"
          />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="11" xChannelSelector="B" yChannelSelector="R">
          <animate attributeName="scale" dur="9s" values="10;14;9;12;10" repeatCount="indefinite" />
        </feDisplacementMap>
      </filter>
    </svg>

    <main class="storefront" aria-label="Entrada da Amoremio">
      <section class="showcase" aria-hidden="true">
        <div class="showcase__glow"></div>
        <div class="showcase__arch">
          <div class="showcase__niche">
            <span class="niche__sun"></span>
            <span class="niche__branch"></span>
            <div class="showcase__shelf">
              <div class="display display--tall"></div>
              <div class="display display--center"></div>
              <div class="display display--small"></div>
            </div>
          </div>
          <div class="showcase__tile" aria-hidden="true"></div>
        </div>
      </section>

      <div class="brand" aria-hidden="true">
        <span class="brand__eyebrow">atelier de afetos</span>
        <h1>Amoremio</h1>
      </div>

      <button
        class="entrance"
        type="button"
        aria-label="Abrir a vitrine Amoremio"
        aria-expanded="false"
      >
        <span class="entrance__hint">Toque para entrar</span>
      </button>

      <div class="curtain curtain--left" aria-hidden="true">
        <div class="curtain__fabric"><span class="curtain__light"></span></div>
      </div>
      <div class="curtain curtain--right" aria-hidden="true">
        <div class="curtain__fabric"><span class="curtain__light"></span></div>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
